services:
    wordpress:
        build:
            context: .
            dockerfile: docker/wordpress.dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.4}
        depends_on:
            - db
            - phpmyadmin
        ports:
            - ${WP_PORT:-8080}:80
            - ${XDEBUG_PORT:-9003}:9003 # xDebug port

        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: pofuser
            WORDPRESS_DB_PASSWORD: pofpass
            WORDPRESS_DB_NAME: poweroffamilies
            WORDPRESS_TABLE_PREFIX: wp_
            WORDPRESS_HOME: http://localhost:${WP_PORT:-8080}
            WORDPRESS_SITEURL: http://localhost:${WP_PORT:-8080}
            # WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-false}
            WORDPRESS_SCRIPT_DEBUG: ${WORDPRESS_DEBUG:-false}
            # xDebug configuration
            XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
            XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003 idekey=docker}
            XDEBUG_IDEKEY: ${XDEBUG_IDEKEY:-docker}
            XDEBUG_LOG: ${XDEBUG_LOG:-/var/log/xdebug.log}
            XDEBUG_LOG_LEVEL: ${XDEBUG_LOG_LEVEL:-7}
            WORDPRESS_CONFIG_EXTRA: |
                define('WP_HOME', getenv('WORDPRESS_HOME', ''));
                define('WP_SITEURL', getenv('WORDPRESS_SITEURL', ''));
                define('SCRIPT_DEBUG', getenv('WORDPRESS_SCRIPT_DEBUG', ''));
        volumes:
            - ./wordpress:/var/www/html
            - type: bind
              source: ./wp-content/themes/power-of-families
              target: /var/www/html/wp-content/themes/power-of-families
            - type: bind
              source: ./wp-content/plugins/pof-bloom-plugin
              target: /var/www/html/wp-content/plugins/pof-bloom-plugin
            - ./.phpcs.xml.dist:/var/www/html/wp-content/themes/power-of-families/.phpcs.xml
            - ./bin:/var/www/html/bin
            - ./xdebug-logs:/var/log
            - ./xdebug-profiles:/tmp/xdebug

    wpcli:
        depends_on:
            - db
            - wordpress
        image: wordpress:cli
        user: '33'
        entrypoint: wp
        command: '--info'
        volumes:
            - ./wordpress:/var/www/html
            - type: bind
              source: ./wp-content/themes/power-of-families
              target: /var/www/html/wp-content/themes/power-of-families
        working_dir: /var/www/html
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: pofuser
            WORDPRESS_DB_PASSWORD: pofpass
            WORDPRESS_DB_NAME: poweroffamilies
            PHP_MEMORY_LIMIT: 20G
            WP_MEMORY_LIMIT: 20G
            WP_CLI_PHP_MEMORY_LIMIT: 4G

    db:
        image: mariadb:${MARIA_DB_VERSION:-10.11.13}
        restart: always
        environment:
            MYSQL_DATABASE: poweroffamilies
            MYSQL_USER: pofuser
            MYSQL_PASSWORD: pofpass
            MYSQL_ROOT_PASSWORD: password
        volumes:
            - ./db-data:/var/lib/mysql
            - ./db-backups:/tmp/backups

    phpmyadmin:
        depends_on:
            - db
        image: phpmyadmin/phpmyadmin:latest
        restart: always
        ports:
            - ${PHPMYADMIN_PORT:-8180}:80
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: password
            UPLOAD_LIMIT: 1024M
            MEMORY_LIMIT: 1024M

    composer:
        image: composer:latest
        volumes:
            - ./wp-content/themes/power-of-families:/var/www/html/wp-content/themes/power-of-families
        working_dir: /var/www/html/wp-content/themes/power-of-families

    test:
        build:
            context: .
            dockerfile: docker/test.dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.4}
        depends_on:
            - db
        environment:
            TEST_DB_NAME: wordpress_tests
            TEST_DB_USER: root
            TEST_DB_PASSWORD: password
            TEST_DB_HOST: db
            WP_VERSION: latest
            XDEBUG_MODE: develop,coverage,debug,profile
            XDEBUG_CONFIG: 'client_host=host.docker.internal client_port=9003 idekey=docker'
            SKIP_DB_CREATE: false
        volumes:
            - ./wordpress:/var/www/html
            - type: bind
              source: ./wp-content/themes/power-of-families
              target: /var/www/html/wp-content/themes/power-of-families
            - type: bind
              source: ./wp-content/plugins/pof-bloom-plugin
              target: /var/www/html/wp-content/plugins/pof-bloom-plugin
            - ./.phpcs.xml.dist:/var/www/html/wp-content/themes/power-of-families/.phpcs.xml
            - ./bin:/var/www/html/bin
            - ./coverage:/var/www/html/coverage
            - ./test-reports:/var/www/html/test-reports
        ports:
            - '${XDEBUG_PORT:-9003}:9003' # xDebug port
        profiles:
            - testing

volumes:
    wordpress:
    db_data:
