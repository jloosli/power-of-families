name: Simple Tests

on:
    pull_request:
        branches:
            - main
            - master
    push:
        branches:
            - main
            - master
    workflow_dispatch:

env:
    PHP_VERSION: '8.4'
    NODE_VERSION: '20'

jobs:
    # Formatting — runs independently of the tests so a style nit reports as
    # its own check rather than as a test failure, and never blocks a deploy.
    format-check:
        name: Format Check
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Check formatting
              run: npm run format:check

    # Unit Tests
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check PHP version is consistent across config
              run: bin/check-php-version

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Run unit tests
              run: |
                  docker compose run --rm test ci-test.sh --coverage-enabled --generate-reports --coverage-dir coverage --test-reports-dir test-reports

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-${{ github.run_number }}
                  path: |
                      test-reports/
                      coverage/
                  retention-days: 30

            - name: Stop services
              if: always()
              run: docker compose down

    # Build and Deploy (only on main branch)
    build-and-deploy:
        name: Build and Deploy
        runs-on: ubuntu-24.04
        needs: unit-tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_KEY: ${{ secrets.SSH_KEY }}
            DEST_PATH: ${{ secrets.DEST_PATH }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  tools: phpunit-polyfills:1.1

            - name: Install PHP dependencies
              run: |
                  cd wp-content/themes/power-of-families
                  composer install --no-dev
                  composer dump-autoload --optimize

            - name: Rsync to remote host
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  rsync -avhz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" wp-content/themes/power-of-families/ "$SSH_USER@$SSH_HOST:$DEST_PATH"
