name: Deploy via SSH

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    # Run tests before deployment
    test-before-deploy:
        name: Test Before Deploy
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Run tests
              run: |
                  docker compose run --rm test ci --coverage-enabled --generate-reports --coverage-dir coverage --test-reports-dir test-reports

            - name: Stop services
              if: always()
              run: docker compose down

    build-and-deploy:
        name: Build and Deploy
        runs-on: ubuntu-24.04
        needs: test-before-deploy
        env:
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_KEY: ${{ secrets.SSH_KEY }}
            DEST_PATH: ${{ secrets.DEST_PATH }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: phpunit-polyfills:1.1

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: |
                  npm run build
                  cd wp-content/themes/power-of-families
                  composer install --no-dev
                  composer dump-autoload --optimize

            - name: Rsync to remote host
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  rsync -avhz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" wp-content/themes/power-of-families/ "$SSH_USER@$SSH_HOST:$DEST_PATH"
