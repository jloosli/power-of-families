name: Deploy via SSH

on:
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        env:
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_KEY: ${{ secrets.SSH_KEY }}
            DEST_PATH: ${{ secrets.DEST_PATH }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Rsync to remote host
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  rsync -avhz --dry-run --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" power-of-families/ "$SSH_USER@$SSH_HOST:$DEST_PATH"
