name: Deploy via SSH

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    # Run tests before deployment
    test-before-deploy:
        name: Test Before Deploy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Install Docker Compose
              run: |
                  sudo curl -L "https://github.com/docker/compose/releases/download/2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                  sudo chmod +x /usr/local/bin/docker-compose

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker-compose up -d db
                  docker-compose up -d wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker-compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run tests
              run: |
                  chmod +x bin/run-tests-ci.sh
                  bin/run-tests-ci.sh --ci-environment github-actions --ci-build-number ${{ github.run_number }} --ci-commit-sha ${{ github.sha }} --ci-branch ${{ github.ref_name }}

            - name: Stop services
              if: always()
              run: docker-compose down

    build-and-deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest
        needs: test-before-deploy
        env:
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_KEY: ${{ secrets.SSH_KEY }}
            DEST_PATH: ${{ secrets.DEST_PATH }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: phpunit-polyfills:1.1

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: |
                  npm run build
                  cd power-of-families
                  composer install --no-dev
                  composer dump-autoload --optimize

            - name: Rsync to remote host
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  rsync -avhz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" power-of-families/ "$SSH_USER@$SSH_HOST:$DEST_PATH"
