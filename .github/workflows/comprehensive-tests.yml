name: Comprehensive Testing

on:
    schedule:
        # Run comprehensive tests daily at 2 AM UTC
        - cron: '0 2 * * *'
    workflow_dispatch:
        inputs:
            run_coverage:
                description: 'Run coverage analysis'
                required: false
                default: true
                type: boolean

env:
    PHP_VERSION: '8.4'
    NODE_VERSION: '20'
    # This nightly run reports coverage rather than gating on it. The test
    # scripts honour these as the highest-precedence enforcement setting.
    FAIL_ON_THRESHOLD_BREACH: 'false'
    FAIL_ON_QUALITY_GATE_FAILURE: 'false'

jobs:
    # Unit Tests
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y xmlstarlet

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run unit tests
              run: |
                  chmod +x bin/run-tests-ci.sh
                  bin/run-tests-ci.sh --ci-environment github-actions --ci-build-number ${{ github.run_number }} --ci-commit-sha ${{ github.sha }} --ci-branch ${{ github.ref_name }}

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-${{ github.run_number }}
                  path: |
                      test-reports/
                      coverage/
                  retention-days: 30

            - name: Stop services
              if: always()
              run: docker compose down

    # Coverage Analysis
    coverage-analysis:
        name: Coverage Analysis
        runs-on: ubuntu-24.04
        needs: unit-tests
        if: ${{ github.event.inputs.run_coverage != 'false' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y xmlstarlet

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run coverage analysis
              run: |
                  chmod +x bin/run-tests-ci.sh
                  bin/run-tests-ci.sh --coverage-enabled --generate-reports --ci-environment github-actions --ci-build-number ${{ github.run_number }} --ci-commit-sha ${{ github.sha }} --ci-branch ${{ github.ref_name }}

            - name: Check coverage thresholds
              run: |
                  chmod +x bin/manage-coverage-thresholds.sh
                  bin/manage-coverage-thresholds.sh check --coverage-dir coverage --thresholds-file coverage-thresholds.json

            - name: Validate quality gates
              run: |
                  chmod +x bin/manage-coverage-thresholds.sh
                  bin/manage-coverage-thresholds.sh validate --coverage-dir coverage --quality-gates-file quality-gates.json

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-reports-${{ github.run_number }}
                  path: |
                      coverage/
                      coverage-ci-results.json
                  retention-days: 30

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v6
              if: always()
              with:
                  file: coverage/clover.xml
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

            - name: Stop services
              if: always()
              run: docker compose down

    # Does the version we test against still match the one production serves?
    # Nightly rather than per-PR on purpose: this makes a live call to
    # poweroffamilies.com, and a third-party lookup on the path that gates every
    # PR is the failure that motivated pinning in the first place (#88).
    wp-pin-drift:
        name: WordPress Pin vs Production
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Compare the pin against production
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_KEY: ${{ secrets.SSH_KEY }}
                  DEST_PATH: ${{ secrets.DEST_PATH }}
              run: |
                  # Read the version over ssh rather than off the front end: the host
                  # 403s GitHub Actions runners by IP, so the http path cannot work
                  # from here. These are the same credentials deploy.yml uses to rsync
                  # to this host on every push to main, and the command is one `cat` of
                  # wp-includes/version.php. Setting SSH_HOST is what selects the ssh
                  # source; with no secrets (a fork) it falls back to http and warns.
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  export SSH_KEY_FILE=~/.ssh/id_rsa

                  set +e
                  bin/check-wp-version
                  status=$?
                  set -e
                  # 1 means the versions genuinely disagree -- the suite is testing
                  # a WordPress production does not run, which is worth a red job.
                  # Anything else means the check could not run (site unreachable,
                  # markup changed). That is not a fact about our code, so it warns
                  # rather than failing and teaching everyone to ignore this job.
                  if [[ $status -eq 1 ]]; then
                      exit 1
                  elif [[ $status -ne 0 ]]; then
                      echo "::warning::check-wp-version could not run (exit $status); the pin itself is unaffected"
                  fi

    # Test Summary and Reporting
    test-summary:
        name: Test Summary
        runs-on: ubuntu-24.04
        needs: [unit-tests, coverage-analysis]
        if: always()
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts/

            - name: Generate test summary
              run: |
                  echo "# Comprehensive Test Summary for Run ${{ github.run_number }}" > test-summary.md
                  echo "" >> test-summary.md
                  echo "**Commit:** ${{ github.sha }}" >> test-summary.md
                  echo "**Branch:** ${{ github.ref_name }}" >> test-summary.md
                  echo "**Triggered by:** ${{ github.event_name }}" >> test-summary.md
                  echo "**Scheduled:** ${{ github.event.schedule }}" >> test-summary.md
                  echo "" >> test-summary.md

                  echo "## Test Results" >> test-summary.md
                  echo "" >> test-summary.md

                  # Check unit tests
                  if [ -d "artifacts/test-results-${{ github.run_number }}" ]; then
                    echo "✅ **Unit Tests:** Passed" >> test-summary.md
                  else
                    echo "❌ **Unit Tests:** Failed" >> test-summary.md
                  fi

                  # Check coverage
                  if [ -d "artifacts/coverage-reports-${{ github.run_number }}" ]; then
                    echo "✅ **Coverage Analysis:** Completed" >> test-summary.md
                  else
                    echo "⚠️ **Coverage Analysis:** Skipped or Failed" >> test-summary.md
                  fi

                  echo "" >> test-summary.md
                  echo "## Artifacts" >> test-summary.md
                  echo "" >> test-summary.md
                  echo "All test artifacts have been uploaded and are available for download." >> test-summary.md
                  echo "" >> test-summary.md
                  echo "## Next Steps" >> test-summary.md
                  echo "" >> test-summary.md
                  echo "- Review any failed tests and fix issues" >> test-summary.md
                  echo "- Check coverage reports for areas needing more tests" >> test-summary.md

            - name: Upload test summary
              uses: actions/upload-artifact@v7
              with:
                  name: test-summary-${{ github.run_number }}
                  path: test-summary.md
                  retention-days: 30

            - name: Create GitHub Issue for Failures
              if: failure()
              uses: actions/github-script@v9
              with:
                  script: |
                      const title = `Test Failures Detected - Run ${{ github.run_number }}`;
                      const body = `# Test Failures Detected

                      **Run:** ${{ github.run_number }}
                      **Commit:** ${{ github.sha }}
                      **Branch:** ${{ github.ref_name }}
                      **Triggered by:** ${{ github.event_name }}

                      Please review the test results and fix any issues.

                      ## Failed Jobs
                      - Check the workflow run for detailed failure information
                      - Review uploaded artifacts for specific error details

                      ## Next Steps
                      1. Review the test logs
                      2. Fix any identified issues
                      3. Re-run the tests to verify fixes
                      4. Close this issue once resolved`;

                      github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: title,
                        body: body,
                        labels: ['bug', 'tests', 'ci']
                      });
