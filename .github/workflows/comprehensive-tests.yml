name: Comprehensive Testing

on:
    schedule:
        # Run comprehensive tests daily at 2 AM UTC
        - cron: '0 2 * * *'
    workflow_dispatch:
        inputs:
            run_coverage:
                description: 'Run coverage analysis'
                required: false
                default: true
                type: boolean
            run_performance:
                description: 'Run performance tests'
                required: false
                default: true
                type: boolean
            run_integration:
                description: 'Run integration tests'
                required: false
                default: true
                type: boolean
            run_security:
                description: 'Run security tests'
                required: false
                default: true
                type: boolean

env:
    PHP_VERSION: '8.4'
    NODE_VERSION: '20'

jobs:
    # Unit Tests
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run unit tests
              run: |
                  chmod +x bin/run-tests-ci.sh
                  bin/run-tests-ci.sh --ci-environment github-actions --ci-build-number ${{ github.run_number }} --ci-commit-sha ${{ github.sha }} --ci-branch ${{ github.ref_name }}

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results-${{ github.run_number }}
                  path: |
                      test-reports/
                      coverage/
                  retention-days: 30

            - name: Stop services
              if: always()
              run: docker compose down

    # Coverage Analysis
    coverage-analysis:
        name: Coverage Analysis
        runs-on: ubuntu-24.04
        needs: unit-tests
        if: ${{ github.event.inputs.run_coverage != 'false' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run coverage analysis
              run: |
                  chmod +x bin/run-tests-ci.sh
                  bin/run-tests-ci.sh --coverage-enabled --generate-reports --generate-dashboard --ci-environment github-actions --ci-build-number ${{ github.run_number }} --ci-commit-sha ${{ github.sha }} --ci-branch ${{ github.ref_name }}

            - name: Check coverage thresholds
              run: |
                  chmod +x bin/manage-coverage-thresholds.sh
                  bin/manage-coverage-thresholds.sh check --coverage-dir coverage --thresholds-file coverage-thresholds.json --fail-on-threshold-breach

            - name: Validate quality gates
              run: |
                  chmod +x bin/manage-coverage-thresholds.sh
                  bin/manage-coverage-thresholds.sh validate --coverage-dir coverage --quality-gates-file quality-gates.json --fail-on-quality-gate-failure

            - name: Generate coverage report
              run: |
                  chmod +x bin/generate-coverage-dashboard.sh
                  bin/generate-coverage-dashboard.sh --coverage-dir coverage --html-dir coverage/html --verbose

            - name: Upload coverage reports
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage-reports-${{ github.run_number }}
                  path: |
                      coverage/
                      coverage-ci-results.json
                  retention-days: 30

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              if: always()
              with:
                  file: coverage/clover.xml
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

            - name: Stop services
              if: always()
              run: docker compose down

    # Performance Testing
    performance-tests:
        name: Performance Tests
        runs-on: ubuntu-24.04
        needs: unit-tests
        if: ${{ github.event.inputs.run_performance != 'false' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run performance benchmarks
              run: |
                  chmod +x bin/test-performance-monitor.sh
                  bin/test-performance-monitor.sh benchmark --memory-limit 2G --output-format json --output-file performance-benchmark.json

            - name: Identify slow tests
              run: |
                  chmod +x bin/test-performance-monitor.sh
                  bin/test-performance-monitor.sh slow-tests --output-file slow-tests.txt

            - name: Check for memory leaks
              run: |
                  chmod +x bin/test-performance-monitor.sh
                  bin/test-performance-monitor.sh memory-leaks

            - name: Generate performance report
              run: |
                  chmod +x bin/test-performance-monitor.sh
                  bin/test-performance-monitor.sh performance-report --output-file performance-report.html

            - name: Upload performance reports
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: performance-reports-${{ github.run_number }}
                  path: |
                      performance-benchmark.json
                      slow-tests.txt
                      performance-report.html
                  retention-days: 30

            - name: Stop services
              if: always()
              run: docker compose down

    # Integration Tests
    integration-tests:
        name: Integration Tests
        runs-on: ubuntu-24.04
        needs: unit-tests
        if: ${{ github.event.inputs.run_integration != 'false' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run integration tests
              run: |
                  chmod +x bin/run-tests-ci.sh
                  bin/run-tests-ci.sh --test-group integration --ci-environment github-actions --ci-build-number ${{ github.run_number }} --ci-commit-sha ${{ github.sha }} --ci-branch ${{ github.ref_name }}

            - name: Upload integration test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: integration-test-results-${{ github.run_number }}
                  path: |
                      test-reports/
                      coverage/
                  retention-days: 30

            - name: Stop services
              if: always()
              run: docker compose down

    # Security Tests
    security-tests:
        name: Security Tests
        runs-on: ubuntu-24.04
        needs: unit-tests
        if: ${{ github.event.inputs.run_security != 'false' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Start Docker services
              run: |
                  docker compose up -d db wordpress

            - name: Wait for services to be ready
              run: |
                  timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h"localhost" -u"root" -p"password" --silent; do sleep 2; done'
                  timeout 60 bash -c 'until curl -f http://localhost:8080 >/dev/null 2>&1; do sleep 2; done'

            - name: Setup test environment
              run: |
                  chmod +x bin/test-env-manager.sh
                  bin/test-env-manager.sh setup --force

            - name: Run security tests
              run: |
                  chmod +x bin/run-tests-ci.sh
                  bin/run-tests-ci.sh --test-group security --ci-environment github-actions --ci-build-number ${{ github.run_number }} --ci-commit-sha ${{ github.sha }} --ci-branch ${{ github.ref_name }}

            - name: Upload security test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: security-test-results-${{ github.run_number }}
                  path: |
                      test-reports/
                  retention-days: 30

            - name: Stop services
              if: always()
              run: docker compose down

    # Test Summary and Reporting
    test-summary:
        name: Test Summary
        runs-on: ubuntu-24.04
        needs:
            [
                unit-tests,
                coverage-analysis,
                performance-tests,
                integration-tests,
                security-tests,
            ]
        if: always()
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts/

            - name: Generate test summary
              run: |
                  echo "# Comprehensive Test Summary for Run ${{ github.run_number }}" > test-summary.md
                  echo "" >> test-summary.md
                  echo "**Commit:** ${{ github.sha }}" >> test-summary.md
                  echo "**Branch:** ${{ github.ref_name }}" >> test-summary.md
                  echo "**Triggered by:** ${{ github.event_name }}" >> test-summary.md
                  echo "**Scheduled:** ${{ github.event.schedule }}" >> test-summary.md
                  echo "" >> test-summary.md

                  echo "## Test Results" >> test-summary.md
                  echo "" >> test-summary.md

                  # Check unit tests
                  if [ -d "artifacts/test-results-${{ github.run_number }}" ]; then
                    echo "✅ **Unit Tests:** Passed" >> test-summary.md
                  else
                    echo "❌ **Unit Tests:** Failed" >> test-summary.md
                  fi

                  # Check coverage
                  if [ -d "artifacts/coverage-reports-${{ github.run_number }}" ]; then
                    echo "✅ **Coverage Analysis:** Completed" >> test-summary.md
                  else
                    echo "⚠️ **Coverage Analysis:** Skipped or Failed" >> test-summary.md
                  fi

                  # Check performance
                  if [ -d "artifacts/performance-reports-${{ github.run_number }}" ]; then
                    echo "✅ **Performance Tests:** Completed" >> test-summary.md
                  else
                    echo "⚠️ **Performance Tests:** Skipped or Failed" >> test-summary.md
                  fi

                  # Check integration
                  if [ -d "artifacts/integration-test-results-${{ github.run_number }}" ]; then
                    echo "✅ **Integration Tests:** Passed" >> test-summary.md
                  else
                    echo "⚠️ **Integration Tests:** Skipped or Failed" >> test-summary.md
                  fi

                  # Check security
                  if [ -d "artifacts/security-test-results-${{ github.run_number }}" ]; then
                    echo "✅ **Security Tests:** Passed" >> test-summary.md
                  else
                    echo "⚠️ **Security Tests:** Skipped or Failed" >> test-summary.md
                  fi

                  echo "" >> test-summary.md
                  echo "## Artifacts" >> test-summary.md
                  echo "" >> test-summary.md
                  echo "All test artifacts have been uploaded and are available for download." >> test-summary.md
                  echo "" >> test-summary.md
                  echo "## Next Steps" >> test-summary.md
                  echo "" >> test-summary.md
                  echo "- Review any failed tests and fix issues" >> test-summary.md
                  echo "- Check coverage reports for areas needing more tests" >> test-summary.md
                  echo "- Review performance reports for optimization opportunities" >> test-summary.md
                  echo "- Address any security concerns identified" >> test-summary.md

            - name: Upload test summary
              uses: actions/upload-artifact@v4
              with:
                  name: test-summary-${{ github.run_number }}
                  path: test-summary.md
                  retention-days: 30

            - name: Create GitHub Issue for Failures
              if: failure()
              uses: actions/github-script@v7
              with:
                  script: |
                      const title = `Test Failures Detected - Run ${{ github.run_number }}`;
                      const body = `# Test Failures Detected

                      **Run:** ${{ github.run_number }}
                      **Commit:** ${{ github.sha }}
                      **Branch:** ${{ github.ref_name }}
                      **Triggered by:** ${{ github.event_name }}

                      Please review the test results and fix any issues.

                      ## Failed Jobs
                      - Check the workflow run for detailed failure information
                      - Review uploaded artifacts for specific error details

                      ## Next Steps
                      1. Review the test logs
                      2. Fix any identified issues
                      3. Re-run the tests to verify fixes
                      4. Close this issue once resolved`;

                      github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: title,
                        body: body,
                        labels: ['bug', 'tests', 'ci']
                      });
